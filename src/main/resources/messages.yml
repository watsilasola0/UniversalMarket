# =====================================================================
#  UniversalMarket - all player-facing text. MiniMessage format.
#
#  Colour language (spec section 6):
#    white        primary item / player names
#    green        balance, money received, success
#    gold         Universal Market prices
#    aqua         player-shop prices
#    yellow       deals, warnings, useful notices
#    red          errors, insufficient funds
#    gray         secondary info, instructions
#    dark_purple  rare / prestige only
#
#  Every key below is referenced by the code - none are decorative.
# =====================================================================

prefix: '<gray>[<gold>UM<gray>]</gray> '

general:
  no-permission: '<red>✕ You do not have permission to do that.'
  player-only: '<red>✕ That command can only be used in game.'
  unknown-player: '<red>✕ No player named <white>%player%</white>.'
  reloaded: '<green>✓ UniversalMarket reloaded.</green> <gray>(%count% market entries)'

terminal:
  restored: '<green>✓ Market Terminal restored.'
  already-have: '<gray>You already have your Market Terminal.'
  duplicates-removed: '<yellow>Removed %count% duplicate terminal(s).</yellow> <gray>You keep exactly one.'
  no-space: '<red>✕ Your inventory is full - free a slot and try again.'
  cannot-place: '<red>✕ The Market Terminal cannot be placed.'
  dissolved: '<dark_purple>⟡ <gray>The Market Terminal dissolves into nothing.</gray> <gray>Type <white>/um</white> to call it back.'

creative:
  entered: |-
    <gray>─────────────────────────────
    <gold>✦ UNIVERSAL MARKET ✦
    <gray>Press <white>E</white> to browse the market.
    <gray>Type <white>/um close</white> to leave.
    <gray>─────────────────────────────
  hud: '<red>♥ %health%/%maxhealth%  <gray>|  <gold>%hunger%/20  <gray>|  <green>%balance%'
  exited: '<gray>Left the Universal Market.'

buy:
  success: '<green>✓ Bought <white>%qty%x %item%</white> for <gold>%price%</gold>  <gray>|  <green>%balance%'
  insufficient: '<red>✕ Insufficient funds.</red> <white>%item%</white> <gray>costs</gray> <gold>%price%</gold> <gray>-</gray> <red>you have %balance%'
  not-for-sale: '<red>✕ <white>%item%</white> is not sold on the Universal Market.'
  inventory-full: '<red>✕ Not enough inventory space - nothing was bought or charged.'
  economy-error: '<red>✕ Economy error - the purchase was cancelled and you were not charged.'
  rare-limit: '<red>✕ <white>%item%</white> purchase limit reached.</red> <gray>Available again in <yellow>%time%</yellow>.'
  cheaper-elsewhere: '<yellow>! <white>%owner%</white> sells this for <aqua>%price%</aqua> <gray>- see Player Shops'

sell:
  success: '<green>+ %amount%</green> <gray>for</gray> <white>%qty%x %item%'
  rejected-custom: '<red>✕ That item has custom data and cannot be sold to the server.'
  stall-given: '<green>✓ Market Stall received.</green> <gray>Place it, fill it with <white>one type</white> of item, then close it.'
  chest-placed: '<gray>Stall placed. Fill it with <white>one type</white> of item, then close it.'
  mixed-items: '<red>✕ One item type per stall.</red> <gray>Take the others out and close it again.'
  type-price: '<gray>Type your price per item in chat (e.g. <white>82</white>, <white>1.7k</white>, <white>200m</white>), or type <white>cancel</white>.'
  bad-price: '<red>✕ That is not a valid price.</red> <gray>Try <white>82</white>, <white>1.7k</white> or <white>200m</white>.'
  listed: '<green>✓ Listed <white>%qty%x %item%</white> at <aqua>%price%</aqua> each</green> <gray>(<white>%total%</white> if it all sells)'
  cancelled: '<gray>Stall cancelled. Your items have been returned.'

backpack:
  bought: '<green>✓ Bought a %tier% <green>backpack</green> <gray>- <white>%slots%</white> slots for <gold>%price%</gold>.'
  upgraded: '<green>✓ Upgraded from %from% <green>to</green> %tier% <gray>- now <white>%slots%</white> slots. Everything inside was kept.'
  insufficient: '<red>✕ A %tier% <red>backpack costs <gold>%price%</gold> - you have <red>%balance%</red>.'
  no-downgrade: '<red>✕ You already own a %tier% <red>backpack.</red> <gray>You can only upgrade.'
  placed: '<gray>Backpack placed. Right-click to open it.'
  broken: '<gray>Backpack removed.</gray> <gray>Your items are safe - recall it from the terminal.'
  recalled: '<green>✓ Backpack recalled.</green> <gray>Everything inside is untouched.'
  auto-recalled: '<gray>Your backpack was left standing and has been recalled automatically.'
  not-yours: '<red>✕ That backpack is not yours.'
  not-yours-break: '<red>✕ That backpack belongs to <white>%owner%</white>.'
  place-to-open: '<gray>Place the backpack down to open it.'
  item-refused: '<red>✕ That cannot go in a backpack.</red> <gray>No shulkers, crates, stalls or terminals.'

crate:
  bought: '<green>✓ Bought a %tier% <green>crate</green> <gray>for <gold>%price%</gold>. Place it to open.'
  insufficient: '<red>✕ A %tier% <red>crate costs <gold>%price%</gold> - you have <red>%balance%</red>.'
  opening: '<gray>Opening your %tier% <gray>crate...'
  result: |-
    <dark_gray>─────────────────────────────
    %tier% <gray>crate opened
    <gray>Contents: %contents%
    <gray>Market value: <white>%worth%
    %verdict%
    <dark_gray>─────────────────────────────

gamble:
  broke: '<red>✕ You cannot cover that bet.'
  won: '<green>✓ You won <white>%amount%</white>!</green> <gray>Balance: <green>%balance%'
  lost: '<red>✕ You lost <white>%amount%</white>.</red> <gray>Balance: <gray>%balance%'
  cashout: '<green>✓ Cashed out <white>%amount%</white> at <yellow>%multiplier%x</yellow>.</green> <gray>Balance: <green>%balance%'
  highlow-won: '<green>✓ It was <white>%number%</white>. Won <white>%amount%</white> at <yellow>%multiplier%x</yellow>.'
  highlow-lost: '<red>✕ It was <white>%number%</white>. Lost <white>%amount%</white>.'

listing:
  announced: '<dark_gray>[<gold>Market<dark_gray>] <white>%player%</white> <gray>is selling <white>%qty%x %item%</white> <gray>at <aqua>%price%</aqua> <gray>each.'
  sold: '<green>+ %amount%</green> <gray>-</gray> <white>%buyer%</white> <gray>bought</gray> <white>%qty%x %item%</white>'
  sold-out: '<red>✕ That listing has just sold out.'
  own-listing: '<red>✕ You cannot buy from your own listing.'
  unavailable: '<red>✕ That listing is no longer available.'
  bought: '<green>✓ Bought <white>%qty%x %item%</white> from <white>%seller%</white> for <aqua>%price%</aqua>'

pay:
  invalid-amount: '<red>✕ Enter a valid amount, e.g. <white>10000</white>, <white>1.5M</white>, <white>2B</white>.'
